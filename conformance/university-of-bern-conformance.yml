  other machine-readable contract is published by the University of Bern, so every
  conformance claim below is evidenced by a probed response, never by a spec document.
docs: https://www.ub.unibe.ch/services/digital_scholarship/apis/index_eng.html
note: >-
  Scored against the Kin Score `education` regime standards[]. Only standards with a
  fetched, quotable response are marked conforms: true. Bern publishes no OpenAPI,
  AsyncAPI, JSON Schema, apis.json, llms.txt or agent card on any host it operates, and
  the two REST surfaces it does run (DSpace and OJS) are both closed to anonymous
  callers, so the conformance story here is entirely protocol- and registry-shaped.
standards:
- id: oai-pmh
  conforms: true
  evidence: >-
    Two institution-operated OAI-PMH 2.0 endpoints answered verb=Identify with valid
    OAI-PMH XML on 2026-09-01. BORIS Portal:
    https://boris-portal.unibe.ch/server/oai/request?verb=Identify -> 200 text/xml,
    repositoryName "BORIS Portal", protocolVersion 2.0, adminEmail borisportal@unibe.ch,
    earliestDatestamp 2026-08-10T07:16:15Z, granularity YYYY-MM-DDThh:mm:ssZ,
    deletedRecord transient. Bern Open Publishing:
    https://bop.unibe.ch/index.php/index/oai?verb=Identify -> 200, repositoryName
    "BOP Serials", protocolVersion 2.0, adminEmail bop-admin@ub.unibe.ch,
    earliestDatestamp 2015-08-25T12:26:22Z, deletedRecord persistent. BORIS also answered
    verb=ListMetadataFormats (200, 3,382 bytes).
- id: shibboleth
  conforms: true
  evidence: >-
    The University of Bern operates its own Shibboleth Identity Provider, published in the
    SWITCHaai federation metadata aggregate
    (https://metadata.aai.switch.ch/metadata.switchaai.xml, 200, 21,322,447 bytes,
    1,957 EntityDescriptors). entityID https://aai-idp.unibe.ch/idp/shibboleth,
    mdui:DisplayName "Universität Bern", shibmd:Scope unibe.ch. 53 entityIDs under
    unibe.ch appear in the aggregate: 1 IDPSSODescriptor and 52 SPSSODescriptors,
    including boris-portal.unibe.ch, boristheses.unibe.ch, exam.unibe.ch and the KSL
    course-system service providers (id-kslprod1/2.id-sys.unibe.ch).
- id: saml
  conforms: true
  evidence: >-
    SAML 2.0 bindings declared on Bern's IdP entity in the SWITCHaai aggregate:
    SingleSignOnService urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect and
    urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST at
    https://unibe.login.eduid.ch/idp/profile/SAML2/{Redirect,POST}/SSO (SSO delegated to
