  - aid: university-of-bern:switchaai-idp
    name: SWITCHaai Identity Federation — University of Bern IdP
    x-operator: federation
    description: >-
      The University of Bern operates its own SAML 2.0 / Shibboleth Identity Provider,
      published as machine-readable metadata in the SWITCHaai federation aggregate (the
      Swiss national research-and-education identity federation, part of eduGAIN). entityID
      https://aai-idp.unibe.ch/idp/shibboleth, mdui:DisplayName "Universität Bern",
      shibmd:Scope unibe.ch; SSO is delegated to SWITCH edu-ID at unibe.login.eduid.ch over
      the HTTP-Redirect and HTTP-POST SAML 2.0 bindings. Verified 2026-09-01 against the
      21.3 MB aggregate (1,957 EntityDescriptors): 53 entityIDs sit under unibe.ch — one
      IdP and 52 service providers, including boris-portal.unibe.ch, boristheses.unibe.ch,
      exam.unibe.ch, the KSL course-system SPs and the ADFS trust at fs.campus.unibe.ch.
      Observed in the wild: https://www.ksl.unibe.ch/ redirects anonymous callers to the
      SWITCH WAYF carrying entityID=https://id-kslprod2.id-sys.unibe.ch/shibboleth. A
      federation is shared by definition; the IdP entity, its scope and its 52 SPs are
      Bern's. The federation's own metadata contract belongs to SWITCH and is not saved here.
    humanURL: https://www.switch.ch/aai/
    baseURL: https://metadata.aai.switch.ch/metadata.switchaai.xml
    tags: [ Identity Federation, Shibboleth, SAML, SWITCHaai, eduGAIN, Single Sign-On ]
    properties:
      - type: Documentation
        url: https://www.switch.ch/aai/
      - type: BaseURL
        url: https://metadata.aai.switch.ch/metadata.switchaai.xml
