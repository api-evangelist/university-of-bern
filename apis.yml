  - aid: university-of-bern:boris-rest
    name: BORIS Portal DSpace REST API (public access suspended)
    x-operator: institution
    description: >-
      BORIS Portal runs DSpace with the DSpace-CRIS extension and, by design, exposes a
      HAL/JSON REST API at /server/api covering communities, collections, items, bitstreams
      and CRIS research entities. It is NOT publicly callable. As of 2026-09-01 every
      anonymous request to boris-portal.unibe.ch — the site root, /server/api and
      /server/api/core/communities alike — returns HTTP 200 carrying a 2,920-byte
      "Temporary Access Restriction" HTML page: "Due to an exceptionally high volume of
      automated traffic, public access to boris-portal has been temporarily suspended...
      Access is currently granted exclusively to the following networks: University of Bern
      Network, Inselspital Network, University VPN Connections." An Accept: application/json
      request gets the same HTML. The previous profile recorded this surface as "confirmed
      live returning HTTP 200" — that was a soft-200 false credit and is corrected here. The
      REST contract itself is DSpace's, not Bern-authored; no spec is saved to this repo.
    humanURL: https://www.ub.unibe.ch/services/open_science/boris_portal/index_eng.html
    baseURL: https://boris-portal.unibe.ch/server/api
    tags: [ DSpace, Repository, REST, Research, Access Restricted, CRIS ]
    properties:
