      /index.php/index/api/v1/contexts returns HTTP 403
      {"error":"api.403.unauthorized","errorMessage":"You are not authorized to access the
      requested resource."} — an authenticated, real API response rather than a wall, which
      is why it is recorded. The API root /index.php/index/api/v1 itself returns 404 and per-journal paths
      (/index.php/BOP/api/v1/contexts) 404, so the baseURL below names the verified collection
      endpoint. Access
      requires an OJS API token issued by the library; there is no public onboarding path
      and no published specification. The contract is PKP's OJS API, not Bern-authored.
    humanURL: https://bop.unibe.ch/
    baseURL: https://bop.unibe.ch/index.php/index/api/v1/contexts
