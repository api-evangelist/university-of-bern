  reason: auth_required
  detail: >-
    Bern's open surfaces are harvesting protocols and registry memberships; every REST
    surface it operates is closed to anonymous callers. BORIS Portal (boris-portal.unibe.ch)
    serves a soft-200 "Temporary Access Restriction" HTML page to the entire public — root
    and /server/api alike — stating that access "is currently granted exclusively to" the
    University of Bern network, the Inselspital network and university VPN connections, and
    boristheses.unibe.ch serves the same page. Only /server/oai/request is exempted, and it
    returns real OAI-PMH XML. The Bern Open Publishing OJS REST API answers
    api.403.unauthorized without a token. There is no developer portal, no OpenAPI, and
    no llms.txt anywhere on a unibe.ch host. This is a correct thin profile, not a failed
    crawl: the surfaces were reached, read, and are genuinely closed.
