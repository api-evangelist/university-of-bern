  - aid: university-of-bern:swisscovery-tenant
    name: swisscovery — University Library of Bern tenant view
    x-operator: tenant
    description: >-
      Library discovery for the University of Bern runs on swisscovery, the Swiss Library
      Service Platform's shared Ex Libris Alma / Primo VE installation. Bern has an
      institution-specific tenant view at https://ubbern.swisscovery.slsp.ch (verified
      2026-09-01: 200, redirects to /discovery/search?vid=41SLSP_UBE:UBE, Primo VE
      application), and DNS confirms the tenancy — ubbern.swisscovery.slsp.ch CNAMEs to
      slsp-ube.primo.exlibrisgroup.com then eu03.primo.exlibrisgroup.com. The collection,
      the holdings and the tenant view are Bern's; the platform, the API and the contract
      are Ex Libris's, so NO Ex Libris specification is saved under this institution. The
      relationship is recorded because it is a real institutional fact and one of the few
      programmable library surfaces Bern has.
    humanURL: https://ubbern.swisscovery.slsp.ch
    tags: [ Library, Discovery, Ex Libris, Primo, Alma, SLSP, Tenant ]
