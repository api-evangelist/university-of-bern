---
aid: university-of-bern
name: University of Bern
description: >-
  The University of Bern (Universität Bern), founded in 1834, is a comprehensive
  public research university in the Swiss capital with around 16,000 students
  across eight faculties, ranked #91 in the QS World University Rankings 2025.
  Its public, machine-readable footprint centers on BORIS Portal, the
  institutional repository and research information system, which runs DSpace
  7.6.1 and exposes both a REST API and an OAI-PMH endpoint. The University
  Library also publishes guidance on data-mining APIs and maintains open-source
  tools on GitHub. There is no single unified, self-service developer portal;
  administrative, course, and identity systems are gated behind institutional
  affiliation and Swiss federated identity (SWITCH edu-ID / Shibboleth).
