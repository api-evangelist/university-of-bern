name: University of Bern
x-type: university
x-category: Public Research University
description: >-
  The University of Bern (Universität Bern), founded in 1834, is a comprehensive public
  research university in the Swiss capital with around 16,000 students across eight
  faculties. It is a federation of buyers rather than an API producer: it operates no
  developer portal, publishes no OpenAPI, AsyncAPI, JSON Schema, apis.json, llms.txt or
  agent card on any host it controls, and offers no self-service API onboarding of any
  kind. What it does operate is protocol- and identity-shaped. Two OAI-PMH 2.0 harvesting
  endpoints run on its own hosts — BORIS Portal, the institutional repository and CRIS on
  DSpace, and BOP Serials, the Bern Open Publishing OJS platform — and both answered
  verb=Identify live. The University Library publishes an Upptime status page whose
  per-service JSON is the only genuinely open, machine-readable HTTP API in this profile.
  The university runs its own Shibboleth Identity Provider inside the SWITCHaai federation
  (entityID https://aai-idp.unibe.ch/idp/shibboleth, scope unibe.ch, 52 service providers),
  and it is a direct DataCite member (symbol UNIBE) with five registered repositories.
  Everything transactional is closed: BORIS Portal's DSpace REST API is not merely
  authenticated but deliberately suspended for the public — the whole host answers every
  anonymous request with a "Temporary Access Restriction" page citing automated-traffic
  volume and allowing only the University of Bern network, the Inselspital network and
  university VPN — and the OJS REST API returns api.403.unauthorized. Library discovery
  runs on a vendor platform under a Bern-specific tenant view (swisscovery / Ex Libris
  Primo VE), and the course system KSL sits behind SWITCH AAI. The library's much-linked
  "APIs" page is a curated guide to OTHER organizations' APIs (OpenAlex, Crossref, Scopus,
  Elsevier, IEEE), not to anything Bern operates.
