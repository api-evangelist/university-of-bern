reviews:
  - date: '2026-06-03'
    rating: 3
    summary: >-
      Verified live, non-fabricated. The University of Bern has no single unified
      self-service developer portal. The strongest confirmed machine-readable
      footprint is BORIS Portal, the institutional repository running DSpace 7.6.1:
      both its DSpace REST API (/server/api) and OAI-PMH endpoint (/server/oai/request,
      verb=Identify confirms repository "BORIS Portal", protocol 2.0) return HTTP 200.
      The University Library publishes a curated APIs/data-mining guide (200) but that
      page documents third-party services rather than University-of-Bern-operated APIs.
      Two official GitHub orgs exist (id-unibe-ch IT-Services, ub-unibe-ch University
      Library). Course/SIS (KSL) and identity systems are gated behind institutional
      affiliation and Swiss federated identity (SWITCH edu-ID / Shibboleth) and were not
      probed as public APIs. The IWI Open Data Show Room did not resolve at review time.
      No endpoints invented.
    endpoints:
